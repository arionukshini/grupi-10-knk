help.title=Help
help.content=This application is used to manage employees, contracts and salaries.\n\nUse the Manage menu to open the employees, contracts and salaries modules.\nUse the SQ and EN buttons on the login screen to switch the application language between Albanian and English.\nUse the Help menu to open this integrated help section.
help.admin.intro=This page explains how to use the system, navigate through modules and use keyboard shortcuts.
