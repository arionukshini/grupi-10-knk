help.admin.language.title=Language
help.admin.language.line1=The language can be changed from the menu or from the account page.
help.admin.language.line2=After changing the language, the main texts are updated automatically.
help.admin.account.title=Account
help.admin.account.line1=From the account page you can view the current user and change the language.
help.admin.account.line2=The logout button clears the session and returns you to the login page.

